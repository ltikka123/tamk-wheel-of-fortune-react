version: '3.9'

services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
    networks:
      - fortunewheel-net

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    networks:
      - fortunewheel-net

networks:
  fortunewheel-net:
    name: fortunewheel-net
    driver: bridge  
